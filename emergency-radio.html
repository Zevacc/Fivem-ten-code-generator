<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radio</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#86868b;--line:#e5e5ea;--fill:#f2f2f7;--blue:#0071e3;--shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:#2c2c2e;--fill:#2c2c2e;--blue:#0a84ff;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:28px 16px}.wrap{max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);font-size:15px;margin:0 0 20px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 2px}
input[type=text],input[type=password],input:not([type]){width:100%;padding:13px 14px;font-size:17px;background:var(--fill);color:var(--text);border:2px solid transparent;border-radius:12px;outline:none;font-family:inherit}
input:focus{border-color:var(--blue);background:var(--card)}
.mono{text-transform:uppercase;letter-spacing:.08em;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.two{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--fill);padding:3px;border-radius:12px;margin:20px 0}
.seg button,.pill{font:inherit;border:0;background:transparent;color:var(--text);cursor:pointer;transition:.15s}
.seg button{padding:10px 4px;border-radius:10px;font-size:15px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.call{font-size:40px;font-weight:700;letter-spacing:.04em;text-align:center;margin:10px 0 20px;font-family:ui-monospace,"SF Mono",Menlo,monospace;color:var(--blue)}
.btn{width:100%;padding:15px;font-size:17px;font-weight:600;color:#fff;background:var(--blue);border:0;border-radius:14px;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sec{background:var(--fill);color:var(--blue)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.pill{padding:8px 14px;border-radius:999px;background:var(--fill);font-size:15px}
.pill.on{background:var(--blue);color:#fff}
.qf{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qf button{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;background:var(--fill);color:var(--text);border:0;cursor:pointer}
.field{margin-bottom:14px}.ib{display:flex;gap:8px}
.mic{width:48px;flex:none;font-size:19px;border:0;border-radius:12px;background:var(--fill);cursor:pointer}
.out{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:18px;line-height:1.45;padding:16px;background:var(--fill);border-radius:14px;min-height:60px;word-break:break-word;margin:16px 0 12px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.acts button{padding:12px;font-size:15px}
.top{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:18px}
.top button{padding:13px;font-size:16px}
.bar{display:flex;justify-content:space-between;align-items:center}
.link{background:none;border:0;color:var(--blue);font:inherit;font-size:15px;cursor:pointer}
.st{font-size:13px;color:var(--muted);min-height:18px;margin-top:10px;text-align:center}
.tg{display:flex;gap:18px;font-size:15px;margin:4px 0 16px}.tg label{display:flex;gap:7px;align-items:center;color:var(--text);font-size:15px;margin:0}.tg{display:grid;gap:0;margin:4px 0 18px}.tg label{justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line)}.tg label:last-child{border:0}.tg input{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:.2s;flex:none;border:0;padding:0}.tg input::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}.tg input:checked{background:#34c759}.tg input:checked::after{left:22px}
details summary{cursor:pointer;font-size:15px;color:var(--blue);list-style:none}
details[open] summary{margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:8px 4px;border-bottom:1px solid var(--line)}td:first-child{font-family:ui-monospace,monospace;font-weight:600;color:var(--blue);white-space:nowrap}
.scroll{max-height:260px;overflow:auto}.hide{display:none}
</style></head><body><div class="wrap">

<section id="login" class="card" style="margin-top:6vh">
  <h1>Sign in</h1><p class="sub">Enter your radio code, like 234. Your letter is added automatically.</p>
  <label for="num">Radio code</label><input id="num" class="mono" maxlength="6" placeholder="234" inputmode="numeric" autocomplete="off">
  <div class="seg" id="depts"><button data-d="EMS">EMS</button><button data-d="Police">Police</button><button data-d="Sheriff">Sheriff</button><button data-d="Fire">Fire</button></div>
  <div class="call" id="prev">—</div>
  <button class="btn" id="go" disabled>Continue</button>
</section>

<section id="main" class="hide">
  <div class="bar" style="margin-bottom:14px"><h1 id="who"></h1><button class="link" id="out">Sign out</button></div>
  <div class="card">
    <div class="top"><button class="btn" id="vl">🎤 Say location</button></div>
    <div class="pills" id="cats"></div>
    <div class="pills" id="scs"></div>
    <div class="field"><label for="unit">Call sign</label><input id="unit" class="mono" maxlength="10"></div>
    <div id="flds"></div>
    <div class="tg"><label>Auto copy<input type="checkbox" id="ac" checked></label><label>Auto speak<input type="checkbox" id="ar" checked></label></div>
    <button class="btn" id="gen">Generate</button>
    <div class="out" id="msg" role="status" aria-live="polite">Pick a scenario, then tap Generate.</div>
    <div class="acts"><button class="btn sec" id="cp">Copy</button><button class="btn sec" id="rd">Speak</button><button class="btn sec" id="sp">Stop</button></div>
    <div class="st" id="st" aria-live="polite"></div>
  </div>
  <div class="card"><details><summary>Radio codes</summary>
    <input id="q" placeholder="Search" style="margin-bottom:10px"><div class="scroll"><table><tbody id="tb"></tbody></table></div></details></div>
</section>

<script>
var $=function(i){return document.getElementById(i)};
var CODES=[["10-4","Acknowledged"],["10-7","Out of service"],["10-8","In service"],["10-9","Repeat"],["10-12","Stand by"],["10-18","Urgent"],["10-20","Location"],["10-22","Disregard"],["10-23","Arrived at scene"],["10-24","Assignment completed"],["10-26","Detaining subject"],["10-27","License info"],["10-28","Plate check"],["10-29","Warrant check"],["10-31","Crime in progress"],["10-32","Man with gun"],["10-33","Emergency"],["10-38","Stopping suspicious vehicle"],["10-39","Urgent, lights and siren"],["10-41","Start of shift"],["10-42","End of shift"],["10-50","Accident"],["10-52","Ambulance needed"],["10-55","Intoxicated driver"],["10-57","Hit and run"],["10-70","Fire alarm"],["10-72","Fire progress report"],["10-76","En route"],["10-77","ETA"],["10-78","Need assistance"],["10-80","Chase in progress"],["10-95","Prisoner in custody"],["10-99","Wanted / stolen"]];
var FL={plate:'Plate',color:'Color',make:'Make / model',dir:'Direction',loc:'Location',desc:'Suspect description',inj:'Injured'};
var QF={color:['Black','White','Red','Blue','Silver','Gray','Green'],make:['Ford','Chevrolet','Toyota','Honda','Dodge','Nissan','BMW'],dir:['northbound','southbound','eastbound','westbound'],loc:['[1064] N HWY Overpass','Main St & 1st Ave','Highway 1','Downtown'],inj:['1','2','3','4'],desc:['male, dark hoodie','male, white shirt','female, dark clothing']};
var VEH=['plate','color','make','loc'],PUR=['plate','color','make','dir','loc'];
var CATS={
"Traffic":[
 ["Traffic stop","{u} 10-38, {u} stopping{veh}{loc}",VEH],
 ["Plate check","{u} 10-28 on{veh}{loc}",VEH],
 ["Driver check","{u} 10-27 and 10-29 on driver of{veh}{loc}",['plate','loc']],
 ["Accident","{u} 10-50, vehicle accident{veh}{loc}{inj}",['plate','color','make','loc','inj']],
 ["Hit and run","{u} 10-57, hit and run{veh}{dir}{loc}",PUR],
 ["DUI","{u} 10-55, intoxicated driver{veh}{dir}{loc}",PUR]],
"Crime":[
 ["Pursuit","{u} 10-80, {u} in pursuit of suspect{veh}{dir}{loc}{desc}",['plate','color','make','dir','loc','desc']],
 ["Armed suspect","{u} 10-32, man with a gun{loc}{desc}, requesting 10-78",['loc','desc']],
 ["In custody","{u} 10-95, subject in custody{loc}{desc}",['loc','desc']],
 ["Crime in progress","{u} 10-31, crime in progress{loc}{desc}",['loc','desc']]],
"Help":[
 ["Emergency","{u} 10-33, emergency{loc}, all units respond",['loc']],
 ["Need backup","{u} 10-78, need assistance{loc}",['loc']],
 ["Ambulance","{u} 10-52, ambulance needed{loc}{inj}",['loc','inj']],
 ["My location","{u} 10-20, currently{loc}",['loc']]],
"Status":[
 ["Start shift","{u} 10-41, beginning tour of duty",[]],
 ["In service","{u} 10-8, in service",[]],
 ["Out of service","{u} 10-7, out of service{loc}",['loc']],
 ["On scene","{u} 10-23, arrived at scene{loc}",['loc']],
 ["Done","{u} 10-24, assignment completed",[]]],
"Fire":[
 ["Fire alarm","{u} 10-70, fire alarm{loc}, 10-71 advise nature of fire",['loc','desc']],
 ["Fire update","{u} 10-72, report on progress of fire{loc}",['loc']]]
};
var LET={Police:'P',Sheriff:'S',EMS:'E',Fire:'F'},NATO={P:'papa',S:'sierra',E:'echo',F:'foxtrot'};
var dept=null,cat=null,sc=0,last='',V={};
function cs(){var v=$('num').value.trim().toUpperCase(),m=v.match(/^(\d+)\D+(\d+)$/)||v.match(/^(\d)(\d+)$/);if(!m)return v;return m[1]+(dept?LET[dept]:'')+m[2]}
function chk(){$('prev').textContent=dept&&$('num').value?cs():'—';$('go').disabled=!(dept&&$('num').value.trim())}
document.querySelectorAll('#depts button').forEach(function(b){b.onclick=function(){document.querySelectorAll('#depts button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');dept=b.dataset.d;chk()}});
$('num').oninput=chk;
$('go').onclick=function(){$('login').classList.add('hide');$('main').classList.remove('hide');$('who').textContent=cs();$('unit').value=cs();cat=(dept==='Fire'||dept==='EMS')?'Fire':'Traffic';sc=0;drawCats()};
$('out').onclick=function(){$('main').classList.add('hide');$('login').classList.remove('hide')};
function st(m){$('st').textContent=m}
function pill(h,t,on,fn){var b=document.createElement('button');b.className='pill'+(on?' on':'');b.textContent=t;b.onclick=fn;h.appendChild(b)}
function drawCats(){var h=$('cats');h.innerHTML='';Object.keys(CATS).forEach(function(k){pill(h,k,k===cat,function(){cat=k;sc=0;drawCats()})});drawSc()}
function drawSc(){var h=$('scs');h.innerHTML='';CATS[cat].forEach(function(s,i){pill(h,s[0],i===sc,function(){sc=i;drawSc()})});drawFields()}
function drawFields(){var h=$('flds');h.innerHTML='';CATS[cat][sc][2].forEach(function(k){
 var d=document.createElement('div');d.className='field';
 d.innerHTML='<label for="f_'+k+'">'+FL[k]+'</label><div class="ib"><input id="f_'+k+'"'+(k==='plate'?' class="mono"':'')+' autocomplete="off"><button type="button" class="mic" aria-label="Dictate '+FL[k]+'">🎤</button></div><div class="qf"></div>';
 var i=d.querySelector('input');i.value=V[k]||'';i.oninput=function(){V[k]=i.value};
 d.querySelector('.mic').onclick=function(){listen(function(t){i.value=V[k]=norm(k,t);st('Set: '+i.value)})};
 (QF[k]||[]).forEach(function(o){var q=document.createElement('button');q.type='button';q.textContent=o;q.onclick=function(){i.value=V[k]=o};d.querySelector('.qf').appendChild(q)});
 h.appendChild(d)})}
$('flds').addEventListener('keydown',function(e){if(e.key==='Enter')gen()});
var DIRS={north:'northbound',south:'southbound',east:'eastbound',west:'westbound'};
function norm(k,t){var l=t.toLowerCase().trim();
 if(k==='dir'){for(var w in DIRS)if(l.indexOf(w)>-1)return DIRS[w]}
 if(k==='plate')return t.replace(/[\s.,-]/g,'').toUpperCase();
 if(k==='color'||k==='make')return t.trim().replace(/^./,function(c){return c.toUpperCase()});
 return t.trim()}
function build(){var s=CATS[cat][sc],u=$('unit').value.trim().toUpperCase()||'UNIT',cm=[V.color,V.make].filter(Boolean).join(' '),p=(V.plate||'').toUpperCase();
 if(p)cm+=(cm?', ':'')+'plate '+p;
 var T={'{u}':u,'{veh}':cm?' '+cm:'','{loc}':V.loc?', at '+V.loc:'','{dir}':V.dir?', '+V.dir:'','{desc}':V.desc?', '+V.desc:'','{inj}':V.inj?', '+V.inj+' injured':''};
 var r=s[1];for(var k in T)r=r.split(k).join(T[k]);return r}
function copy(t){function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');st('Copied')}catch(e){st('Copy failed')}a.remove()}
 try{navigator.clipboard.writeText(t).then(function(){st('Copied')},fb)}catch(e){fb()}}
function say(t){if(!window.speechSynthesis){st('Speech not supported in this browser');return}speechSynthesis.cancel();
 var s=t.replace(/\b(\d+)([A-Z])(\d+)\b/g,function(m,a,b,c){return a.split('').join(' ')+' '+(NATO[b]||b)+' '+c.split('').join(' ')}).replace(/10-(\d+)/g,'ten $1');
 var p=(V.plate||'').toUpperCase();if(p)s=s.split(p).join(p.split('').join(' '));
 var u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.95;var vs=speechSynthesis.getVoices(),v=vs.filter(function(x){return x.lang==='en-US'})[0]||vs.filter(function(x){return /^en/i.test(x.lang)})[0];if(v)u.voice=v;speechSynthesis.speak(u)}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=function(){};
$('rd').onclick=function(){say(last||$('msg').textContent)};$('sp').onclick=function(){if(window.speechSynthesis)speechSynthesis.cancel()};
$('cp').onclick=function(){copy(last||$('msg').textContent)};
function gen(){var m=build();$('msg').textContent=m;last=m;if($('ac').checked)copy(m);if($('ar').checked)say(m)}
$('gen').onclick=gen;
['ac','ar'].forEach(function(i){try{var v=localStorage.getItem('sw_'+i);if(v!==null)$(i).checked=v==='1'}catch(e){}$(i).onchange=function(){try{localStorage.setItem('sw_'+i,$(i).checked?'1':'0')}catch(e){}if(i==='ar'&&!$(i).checked&&window.speechSynthesis)speechSynthesis.cancel()}});
function listen(cb){var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){st('Voice input needs Chrome or Edge');return}
 var r=new R();r.lang='en-US';r.interimResults=false;r.onstart=function(){st('Listening…')};r.onerror=function(e){st('Mic error: '+e.error)};r.onresult=function(e){cb(e.results[0][0].transcript)};r.start()}
$('vl').onclick=function(){listen(function(t){V.loc=t.trim();drawFields();gen()})};
function tbl(f){f=(f||'').toLowerCase();$('tb').innerHTML=CODES.filter(function(c){return !f||(c[0]+' '+c[1]).toLowerCase().indexOf(f)>-1}).map(function(c){return '<tr><td>'+c[0]+'</td><td>'+c[1]+'</td></tr>'}).join('')}
$('q').oninput=function(){tbl($('q').value)};tbl();
</script></div></body></html>
